<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مغامرة كفو للأطفال</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(circle at 50% -10%,#0b5fff 0,#061b53 30%,#020b25 68%,#010615 100%);padding:18px}.app{max-width:820px;margin:auto}
.hero,.game,.finish{border:1px solid rgba(78,220,255,.45);background:rgba(3,15,48,.84);border-radius:28px;box-shadow:0 0 30px rgba(0,160,255,.18),inset 0 0 24px rgba(0,116,255,.08)}
.hero{padding:18px;text-align:center}.logo{width:115px;height:115px;object-fit:cover;border-radius:50%;border:2px solid #4ee8ff;box-shadow:0 0 24px #00aaff;margin:auto;display:block}
h1{font-size:28px;margin:12px 0 4px}.sub{color:#bfefff;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{padding:10px 5px;border-radius:17px;background:linear-gradient(180deg,rgba(10,70,155,.72),rgba(3,25,72,.8));border:1px solid rgba(91,225,255,.35);font-weight:800}
.game{margin-top:14px;padding:20px;text-align:center}.question{font-size:24px;font-weight:900;margin:4px 0 16px}.stage{max-width:380px;height:170px;margin:auto auto 18px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(145deg,#020a22,#083273);border:2px dashed #1ddcff}
#shape{width:112px;height:112px;border:4px solid rgba(255,255,255,.75);filter:drop-shadow(0 0 12px rgba(0,210,255,.65))}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{font:inherit;cursor:pointer}.ans{min-height:58px;border-radius:18px;border:1px solid #32dfff;background:linear-gradient(180deg,#0a4fae,#07306f);color:#fff;font-weight:900;font-size:17px}.ans:active{transform:scale(.98)}.ans:disabled{opacity:.88}
.feedback{min-height:52px;padding-top:15px;font-size:18px;font-weight:900;color:#bdf6ff}.next,.restart{border:1px solid #78efff;background:linear-gradient(90deg,#0067ff,#00bde8);color:#fff;border-radius:17px;padding:12px 24px;font-weight:900;min-height:48px}.hidden{display:none!important}
.finish{margin-top:14px;padding:30px;text-align:center}.footer{text-align:center;color:#7fcde8;font-size:12px;margin-top:16px}@media(min-width:650px){.answers{grid-template-columns:repeat(4,1fr)}.logo{width:130px;height:130px}}
